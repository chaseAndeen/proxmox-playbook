---
- name: AMP | Check if AMP is installed
  ansible.builtin.stat:
    path: "/opt/cubecoders/amp/ampinstmgr"
  register: _amp_binary

- name: AMP | Fetch install credentials from SSM
  ansible.builtin.set_fact:
    _amp_admin_password: "{{ lookup('amazon.aws.ssm_parameter', amp_ssm_admin_password, profile=aws_profile, region=aws_region) }}"
    _amp_sys_password: "{{ lookup('amazon.aws.ssm_parameter', amp_ssm_sys_password, profile=aws_profile, region=aws_region) }}"
    _amp_licence_key: "{{ lookup('amazon.aws.ssm_parameter', amp_ssm_licence_key, profile=aws_profile, region=aws_region) }}"
  no_log: true
  when: not _amp_binary.stat.exists

- name: AMP | Run GetAMP installation (async)
  ansible.builtin.shell:
    cmd: |
      export USE_ANSWERS="y"
      export ANSWER_AMPUSER="{{ amp_ads_admin_user }}"
      export ANSWER_AMPPASS="{{ _amp_admin_password }}"
      export ANSWER_SYSPASSWORD="{{ _amp_sys_password }}"
      export ANSWER_INSTALLDOCKER="y"
      export ANSWER_INSTALLSRCDSLIBS="y"
      bash <(wget -qO- https://cubecoders.com/getamp.sh) >/var/log/getamp.log 2>&1
    executable: /bin/bash
  async: 1800
  poll: 0
  register: _amp_install_async
  when: not _amp_binary.stat.exists

- name: AMP | Wait for ADS port to be listening
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ amp_ads_port }}"
    delay: 10
    timeout: 900
    state: started
  when: not _amp_binary.stat.exists

- name: AMP | Login to API
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ amp_ads_port }}/API/Core/Login"
    method: POST
    headers:
      Accept: application/json
      User-Agent: AnsibleAMPProvisioner/1.0
    body_format: json
    body:
      username: "{{ amp_ads_admin_user }}"
      password: "{{ _amp_admin_password }}"
      token: ""
      rememberMe: false
    status_code: 200
  register: _amp_login
  when: not _amp_binary.stat.exists

- name: AMP | Extract Session ID
  ansible.builtin.set_fact:
    _amp_session_id: "{{ _amp_login.json.sessionID }}"
  when: not _amp_binary.stat.exists

- name: AMP | Activate licence
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ amp_ads_port }}/API/Core/ActivateAMPLicence"
    method: POST
    headers:
      Accept: application/json
      User-Agent: AnsibleAMPProvisioner/1.0
      Authorization: "Bearer {{ _amp_session_id }}"
    body_format: json
    body:
      LicenceKey: "{{ _amp_licence_key }}"
      QueryOnly: false
    status_code: 200
  when: not _amp_binary.stat.exists

- name: AMP | Set Instance Key
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ amp_ads_port }}/API/Core/SetConfig"
    method: POST
    headers:
      Accept: application/json
      User-Agent: AnsibleAMPProvisioner/1.0
      Authorization: "Bearer {{ _amp_session_id }}"
    body_format: json
    body:
      node: "ADSModule.Defaults.NewInstanceKey"
      value: "{{ _amp_licence_key }}"
    status_code: 200
  when: not _amp_binary.stat.exists

